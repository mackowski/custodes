# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: cheatsheet-review second security voice (DeepSeek V4 Pro on Workers AI), same cases as the first

# cheatsheet-review (ADR 0017). system.txt is the prompt the agent ships (a unit test enforces it;
# regenerate with workers/agents/scripts/print-review-prompts.ts).
providers:
  - id: file://../../providers/chat-gateway.mjs
    label: deepseek-v4-pro-0813
    config:
      transport: workers-ai
      model: '@cf/deepseek-ai/deepseek-v4-pro-0813'
      max_tokens: 12000
      runId: promptfoo-cheatsheet-review-security-2

prompts:
  - '{{user}}'

defaultTest:
  vars:
    system: file://system.txt
  assert:
    - type: is-json
    - type: javascript
      value: >-
        ((o) => ['PASS','CONCERNS','BLOCK','N/A'].includes(o.verdict) && Array.isArray(o.findings) && o.findings.every((f) => ['BLOCKER','MAJOR','MINOR','NIT'].includes(f.severity) && typeof f.file === 'string' && typeof f.problem === 'string'))(JSON.parse(output))

tests: file://../cheatsheet-review-security/cases.yaml
