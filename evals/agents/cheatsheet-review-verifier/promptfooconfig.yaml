# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: cheatsheet-review claim verifier (DeepSeek V4.1 Flash on Workers AI, low effort as shipped)

# cheatsheet-review (ADR 0017, #90). system.txt is the prompt the agent ships (a unit test enforces
# it; regenerate with workers/agents/scripts/print-review-prompts.ts).
providers:
  - id: file://../../providers/chat-gateway.mjs
    label: deepseek-v4.1-flash-1017
    config:
      transport: workers-ai
      model: '@cf/deepseek-ai/deepseek-v4.1-flash-1017'
      max_tokens: 8000
      reasoning_effort: low
      runId: promptfoo-cheatsheet-review-verifier

prompts:
  - '{{user}}'

defaultTest:
  vars:
    system: file://system.txt
  assert:
    - type: is-json
    - type: javascript
      value: >-
        ((o) => Array.isArray(o.claims) && o.claims.every((c) => typeof c.id === 'string' && ['CONFIRMED','REFUTED','NOT-FOUND'].includes(c.verdict) && typeof c.reason === 'string'))(JSON.parse(output))

tests: file://cases.yaml
