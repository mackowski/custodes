# --- New guidance: must not be skip; close is the expected outcome ---
- description: new recommendation paragraph
  vars:
    expect: close|flag
    diff: |
      --- cheatsheets/Password_Storage_Cheat_Sheet.md
      @@ -60,0 +61,6 @@
      +### Pepper Rotation
      +
      +Applications should rotate the pepper every 90 days. Store the previous pepper alongside the
      +new one and re-hash each password with the new pepper at the next successful login. Keep the
      +pepper in a hardware security module or a secrets vault, never in the database.
      +
- description: new code sample
  vars:
    expect: close|flag
    diff: |
      --- cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
      @@ -140,0 +141,9 @@
      +#### Go Example
      +
      +```go
      +stmt, err := db.Prepare("SELECT name FROM users WHERE id = ?")
      +if err != nil { return err }
      +defer stmt.Close()
      +row := stmt.QueryRow(userID)
      +```
      +
- description: reworded recommendation that changes meaning
  vars:
    expect: close|flag
    diff: |
      --- cheatsheets/Session_Management_Cheat_Sheet.md
      @@ -201,2 +201,2 @@
      -Session timeouts should be between 2 and 5 minutes for high-value applications.
      -Low-risk applications may use 15 to 30 minutes.
      +Session timeouts are no longer recommended; rely on refresh tokens with a 24 hour lifetime
      +and revoke them only on logout.
