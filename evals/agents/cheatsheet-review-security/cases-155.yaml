        'user': "Process facts (established by code, not by the author):\n- Repository: OWASP/CheatSheetSeries, pull request #2970, head commit c9c0df359267b925dff3984ae2794a3b44ad896a\n- Files changed: 1; net added lines in the reviewed files: 13\n- AI Tool Usage Disclosure section: ok\n- Linked issues: none linked\n- Upstream limits (process note for the maintainer, never a finding; pr-gate enforces them): at most 3 files, and 1500 net added lines without a linked issue.\n\nPull request title and description:\n\n<untrusted source=\"pr-title\">\nDjango Security: production defaults, Referrer-Policy, COOP and __Host- cookies\n</untrusted>\n<untrusted source=\"pr-body\">\nAdds production defaults and header settings, as agreed in #2971.\n\nAI Tool Usage Disclosure: [x] I used AI and checked every source.\n</untrusted>\n\nNumbered diff (new-side line numbers on the left):\n\n<untrusted source=\"pr-diff:cheatsheets/Django_Security_Cheat_Sheet.md\">\n--- cheatsheets/Django_Security_Cheat_Sheet.md\n@@ new lines 10-25 @@\n   10     | \n   11     | - Always keep Django and your application's dependencies up-to-date to keep up with security vulnerabilities.\n   12     | - Ensure that the application is never in `DEBUG` mode in a production environment. Never run `DEBUG = True` in production.\n   13 ADD | - Make production values the defaults in `settings.py`, and loosen them only through explicit development overrides. Read values that each deployment must supply, such as `SECRET_KEY` and `ALLOWED_HOSTS`, from the environment without a fallback, as Django's [deployment checklist](https://docs.djangoproject.com/en/5.2/howto/deployment/checklist/#secret-key) shows for `SECRET_KEY`. A missing value then stops the application at startup:\n   14 ADD | \n   15 ADD |   ```python\n   16 ADD |   import os\n   17 ADD |   SECRET_KEY = os.environ[\"DJANGO_SECRET_KEY\"]\n   18 ADD |   ALLOWED_HOSTS = os.environ[\"DJANGO_ALLOWED_HOSTS\"].split(\",\")\n   19 ADD |   DEBUG = os.environ.get(\"DJANGO_DEBUG\") == \"True\"  # enabled only by an explicit override\n   20 ADD |   ```\n   21 ADD | \n   22 ADD | - Keep settings whose safety depends on the infrastructure out of these defaults, and enable them only in deployments that meet their conditions. This applies to `SECURE_PROXY_SSL_HEADER` (see [HTTPS](#https)) and to HSTS `preload`, which is [hard to undo](HTTP_Strict_Transport_Security_Cheat_Sheet.md#examples).\n   23     | - Use packages like [`django_ratelimit`](https://django-ratelimit.readthedocs.io/en/stable/) or [`django-axes`](https://django-axes.readthedocs.io/en/latest/index.html) to prevent brute-force attacks.\n   24     | \n   25     | ## Authentication\n@@ new lines 125-132 @@\n  125     | \n  126     | - `SECURE_CONTENT_TYPE_NOSNIFF`: Set this key to `True`. Protects against MIME type sniffing attacks by enabling the header `X-Content-Type-Options: nosniff`.\n  127     | - `SECURE_HSTS_SECONDS`: A positive value adds [HTTP Strict Transport Security (HSTS)](https://docs.djangoproject.com/en/5.2/ref/middleware/#http-strict-transport-security) to HTTPS responses, instructing supporting browsers to use HTTPS for the specified period. It does not reject HTTP requests on the server or protect a browser's first connection before it knows the policy; [preloading addresses that initial-connection gap](https://www.rfc-editor.org/rfc/rfc6797.html#section-12.3).\n  128 ADD | - `SECURE_REFERRER_POLICY`: Keep the [default](https://docs.djangoproject.com/en/5.2/ref/settings/#secure-referrer-policy), `same-origin`, which sends no referrer to other origins. It is stricter than the `strict-origin-when-cross-origin` baseline in the [HTTP Headers Cheat Sheet](HTTP_Headers_Cheat_Sheet.md#referrer-policy). Do not tighten it to `no-referrer`, because [Django's CSRF protection needs the `Referer` header over HTTPS](https://docs.djangoproject.com/en/5.2/ref/middleware/#referrer-policy).\n  129 ADD | - `SECURE_CROSS_ORIGIN_OPENER_POLICY`: Keep the [default](https://docs.djangoproject.com/en/5.2/ref/middleware/#cross-origin-opener-policy), `same-origin`, which the [HTTP Headers Cheat Sheet](HTTP_Headers_Cheat_Sheet.md#cross-origin-opener-policy-coop) also recommends. If your page opens a cross-origin popup that must reach back through `window.opener`, such as some sign-in flows, use `same-origin-allow-popups` instead of disabling the header.\n  130     | \n  131     | Include the `django.middleware.clickjacking.XFrameOptionsMiddleware` module in the `MIDDLEWARE` setting in your project's `settings.py` (This module should be listed after the `django.middleware.security.SecurityMiddleware` module as ordering is important). This module is used to set the following parameters:\n  132     | \n@@ new lines 145-151 @@\n  145     | \n  146     | - `SESSION_COOKIE_SECURE`: Set this key to `True` in the `settings.py` file. This will send the session cookie over secure (HTTPS) connections only.\n  147     | - `CSRF_COOKIE_SECURE`: Set this key to `True` in the `settings.py` file. This will ensure that the CSRF cookie is sent over secure connections only.\n  148 ADD | - Prefix the session and CSRF cookie names with [`__Host-`](Session_Management_Cheat_Sheet.md#cookie-name-prefixes), for example `SESSION_COOKIE_NAME = \"__Host-sessionid\"` and `CSRF_COOKIE_NAME = \"__Host-csrftoken\"`. A subdomain then cannot set these cookies for your host, which mitigates the [subdomain CSRF bypass](https://docs.djangoproject.com/en/5.2/ref/csrf/#limitations) that Django documents. Browsers accept the prefix only on `Secure` cookies with `Path=/` and no `Domain`, so it requires the two settings above and the default `SESSION_COOKIE_PATH`, `SESSION_COOKIE_DOMAIN`, `CSRF_COOKIE_PATH` and `CSRF_COOKIE_DOMAIN`. Renaming the cookies logs out existing users and breaks JavaScript that reads the CSRF cookie by its old name.\n  149     | - Whenever you set a custom cookie in a view using the `HttpResponse.set_cookie()` method, make sure to set its secure parameter to `True`.\n  150     | \n  151     |   ```python\n</untrusted>\n\nFull text of each changed cheat sheet at the head commit:\n\n<untrusted source=\"cheatsheet:cheatsheets/Django_Security_Cheat_Sheet.md@c9c0df3\">\n# Django Security Cheat Sheet\n\n## Introduction\n\nThe Django framework is a powerful Python web framework, and it comes with built-in security features that can be used out-of-the-box to prevent common web vulnerabilities. This cheat sheet lists actions and security tips developers can take to develop secure Django applications. It aims to cover common vulnerabilities to increase the security posture of your Django application. Each item has a brief explanation and relevant code samples that are specific to the Django environment.\n\nThe Django framework provides some built-in security features that aim to be secure-by-default. These features are also flexible to empower a developer to re-use components for complex use-cases. This opens up scenarios where developers unfamiliar with the inner workings of the components can configure them in an insecure way. This cheat sheet aims to enumerate some such use cases.\n\n## General Recommendations\n\n- Always keep Django and your application's dependencies up-to-date to keep up with security vulnerabilities.\n- Ensure that the application is never in `DEBUG` mode in a production environment. Never run `DEBUG = True` in production.\n- Make production values the defaults in `settings.py`, and loosen them only through explicit development overrides. Read values that each deployment must supply, such as `SECRET_KEY` and `ALLOWED_HOSTS`, from the environment without a fallback, as Django's [deployment checklist](https://docs.djangoproject.com/en/5.2/howto/deployment/checklist/#secret-key) shows for `SECRET_KEY`. A missing value then stops the application at startup:\n\n  ```python\n  import os\n  SECRET_KEY = os.environ[\"DJANGO_SECRET_KEY\"]\n  ALLOWED_HOSTS = os.environ[\"DJANGO_ALLOWED_HOSTS\"].split(\",\")\n  DEBUG = os.environ.get(\"DJANGO_DEBUG\") == \"True\"  # enabled only by an explicit override\n  ```\n\n- Keep settings whose safety depends on the infrastructure out of these defaults, and enable them only in deployments that meet their conditions. This applies to `SECURE_PROXY_SSL_HEADER` (see [HTTPS](#https)) and to HSTS `preload`, which is [hard to undo](HTTP_Strict_Transport_Security_Cheat_Sheet.md#examples).\n- Use packages like [`django_ratelimit`](https://django-ratelimit.readthedocs.io/en/stable/) or [`django-axes`](https://django-axes.readthedocs.io/en/latest/index.html) to prevent brute-force attacks.\n\n## Authentication\n\n- Use `django.contrib.auth` app for views and forms for user authentication operations such as login, logout, password change, etc. Include the module and its dependencies `django.contrib.contenttypes` and `django.contrib.sessions` in the `INSTALLED_APPS` setting in the `settings.py` file.\n\n  ```python\n  INSTALLED_APPS = [\n      # ...\n      'django.contrib.auth',\n      'django.contrib.contenttypes',\n      'django.contrib.sessions',\n      # ...\n  ]\n  ```\n\n- Use the `@login_required` decorator to ensure that only authenticated users can access a view. The sample code below illustrates usage of `@login_required`.\n\n  ```python\n  from django.contrib.auth.decorators import login_required\n\n  # User is redirected to default login page if not authenticated.\n  @login_required\n  def my_view(request):\n    # Your view logic\n\n  # User is redirected to custom '/login-page/' if not authenticated.\n  @login_required(login_url='/login-page/')\n  def my_view(request):\n    # Your view logic\n  ```\n\n- Use password validators for enforcing password policies. Add or update the `AUTH_PASSWORD_VALIDATORS` setting in the `settings.py` file to include specific validators required by your application.\n\n  ```python\n  AUTH_PASSWORD_VALIDATORS = [\n    {\n      # Checks the similarity between the password and a set of attributes of the user.\n      'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator',\n      'OPTIONS': {\n        'user_attributes': ('username', 'email', 'first_name', 'last_name'),\n        'max_similarity': 0.7,\n      }\n    },\n    {\n      # Checks whether the password meets a minimum length.\n      'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator',\n      'OPTIONS': {\n        'min_length': 8,\n      }\n    },\n    {\n      # Checks whether the password occurs in a list of common passwords\n      'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator',\n    },\n    {\n      # Checks whether the password isn’t entirely numeric\n      'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator',\n    }\n  ]\n  ```\n\n- Store passwords using `make-password` utility function to hash a plain-text password.\n\n  ```python\n  from django.contrib.auth.hashers import make_password\n  #...\n  hashed_pwd = make_password('plaintext_password')\n  ```\n\n- Check a plaintext password against a hashed password by using the  `check-password` utility function.\n\n  ```python\n  from django.contrib.auth.hashers import check_password\n  #...\n  plain_pwd = 'plaintext_password'\n  hashed_pwd = 'hashed_password_from_database'\n\n  if check_password(plain_pwd, hashed_pwd):\n    print(\"The password is correct.\")\n  else:\n    print(\"The password is incorrect.\")\n  ```\n\n## Key Management\n\nThe `SECRET_KEY` parameter in settings.py is used for cryptographic signing and should be kept confidential. Consider the following recommendations:\n\n- Generate a key at least 50 characters or more, containing a mix of letters, digits, and symbols.\n- Ensure that the `SECRET_KEY` is generated using a strong random generator, such as `get_random_secret_key()` function in Django.\n- Avoid hard coding the `SECRET_KEY` value in settings.py or any other location. Consider storing the key-value in environment variables or secrets managers.\n\n  ```python\n  import os\n  SECRET_KEY = os.environ.get('DJANGO_SECRET_KEY')\n  ```\n\n- Regularly rotate the key, keeping in mind that this action can invalidate sessions, password reset tokens, etc. Rotate the key immediately it if it ever gets exposed.\n\n## Headers\n\nInclude the `django.middleware.security.SecurityMiddleware` module in the `MIDDLEWARE` setting in your project's `settings.py` to add security-related headers to your responses. This module is used to set the following parameters:\n\n- `SECURE_CONTENT_TYPE_NOSNIFF`: Set this key to `True`. Protects against MIME type sniffing attacks by enabling the header `X-Content-Type-Options: nosniff`.\n- `SECURE_HSTS_SECONDS`: A positive value adds [HTTP Strict Transport Security (HSTS)](https://docs.djangoproject.com/en/5.2/ref/middleware/#http-strict-transport-security) to HTTPS responses, instructing supporting browsers to use HTTPS for the specified period. It does not reject HTTP requests on the server or protect a browser's first connection before it knows the policy; [preloading addresses that initial-connection gap](https://www.rfc-editor.org/rfc/rfc6797.html#section-12.3).\n- `SECURE_REFERRER_POLICY`: Keep the [default](https://docs.djangoproject.com/en/5.2/ref/settings/#secure-referrer-policy), `same-origin`, which sends no referrer to other origins. It is stricter than the `strict-origin-when-cross-origin` baseline in the [HTTP Headers Cheat Sheet](HTTP_Headers_Cheat_Sheet.md#referrer-policy). Do not tighten it to `no-referrer`, because [Django's CSRF protection needs the `Referer` header over HTTPS](https://docs.djangoproject.com/en/5.2/ref/middleware/#referrer-policy).\n- `SECURE_CROSS_ORIGIN_OPENER_POLICY`: Keep the [default](https://docs.djangoproject.com/en/5.2/ref/middleware/#cross-origin-opener-policy), `same-origin`, which the [HTTP Headers Cheat Sheet](HTTP_Headers_Cheat_Sheet.md#cross-origin-opener-policy-coop) also recommends. If your page opens a cross-origin popup that must reach back through `window.opener`, such as some sign-in flows, use `same-origin-allow-popups` instead of disabling the header.\n\nInclude the `django.middleware.clickjacking.XFrameOptionsMiddleware` module in the `MIDDLEWARE` setting in your project's `settings.py` (This module should be listed after the `django.middleware.security.SecurityMiddleware` module as ordering is important). This module is used to set the following parameters:\n\n- `X_FRAME_OPTIONS`: Set this key to 'DENY' or 'SAMEORIGIN'. This setting adds the `X-Frame-Options` header to all HTTP responses. This protects against clickjacking attacks.\n\n## Content Security Policy\n\nDjango 6.0 and later provide built-in Content Security Policy (CSP) support. Enable `django.middleware.csp.ContentSecurityPolicyMiddleware` and configure `SECURE_CSP` to enforce a policy, or `SECURE_CSP_REPORT_ONLY` to monitor violations without blocking content. Follow [Django's CSP configuration guide](https://docs.djangoproject.com/en/6.0/howto/csp/). Earlier versions require a third-party library such as `django-csp` or configuration of HTTP response headers.\n\nFor more details:\n\n- [OWASP Content Security Policy Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html)\n- [Django Security Documentation](https://docs.djangoproject.com/en/stable/topics/security/)\n\n## Cookies\n\n- `SESSION_COOKIE_SECURE`: Set this key to `True` in the `settings.py` file. This will send the session cookie over secure (HTTPS) connections only.\n- `CSRF_COOKIE_SECURE`: Set this key to `True` in the `settings.py` file. This will ensure that the CSRF cookie is sent over secure connections only.\n- Prefix the session and CSRF cookie names with [`__Host-`](Session_Management_Cheat_Sheet.md#cookie-name-prefixes), for example `SESSION_COOKIE_NAME = \"__Host-sessionid\"` and `CSRF_COOKIE_NAME = \"__Host-csrftoken\"`. A subdomain then cannot set these cookies for your host, which mitigates the [subdomain CSRF bypass](https://docs.djangoproject.com/en/5.2/ref/csrf/#limitations) that Django documents. Browsers accept the prefix only on `Secure` cookies with `Path=/` and no `Domain`, so it requires the two settings above and the default `SESSION_COOKIE_PATH`, `SESSION_COOKIE_DOMAIN`, `CSRF_COOKIE_PATH` and `CSRF_COOKIE_DOMAIN`. Renaming the cookies logs out existing users and breaks JavaScript that reads the CSRF cookie by its old name.\n- Whenever you set a custom cookie in a view using the `HttpResponse.set_cookie()` method, make sure to set its secure parameter to `True`.\n\n  ```python\n  response = HttpResponse(\"Some response\")\n  response.set_cookie('my_cookie', 'cookie_value', secure=True)\n  ```\n\n## Cross Site Request Forgery (CSRF)\n\n- Include the `django.middleware.csrf.CsrfViewMiddleware` module in the `MIDDLEWARE` setting in your project's `settings.py` to add CSRF related headers to your responses.\n- In forms use the `{% raw %}{% csrf_token %}{% endraw %}` template tag to include the CSRF token. A sample is shown below.\n\n  ```html\n  <form method=\"post\">\n      {% raw %}{% csrf_token %}{% endraw %}\n      <!-- Your form fields here -->\n  </form>\n  ```\n\n- For AJAX calls, the CSRF token for the request has to be extracted prior to being used in the AJAX call.  \n- Additional recommendations and controls can be found at Django's [Cross Site Request Forgery protection](https://docs.djangoproject.com/en/5.2/ref/csrf/) documentation.\n\n## Cross Site Scripting (XSS)\n\nThe recommendations in this section are in addition to XSS recommendations already mentioned previously.\n\n- Use the built-in template system to render templates in Django. Refer to Django's [Automatic HTML escaping](https://docs.djangoproject.com/en/5.2/ref/templates/language/#automatic-html-escaping) documentation to learn more.\n- Try to avoid using the `safe` filter (or `mark_safe` function) to disable Django's automatic template escaping. If you do need to use it, make sure the input is from a trusted source. Extra caution is required when handling user-controlled inputs.\n- Use the [`json_script`](https://docs.djangoproject.com/en/5.2/ref/templates/builtins/#json-script) template filter for passing data to JavaScript in Django templates.\n- Refer to Django's [Cross Site Scripting (XSS) protection](https://docs.djangoproject.com/en/5.2/topics/security/#cross-site-scripting-xss-protection) documentation to learn more.\n\n## HTTPS\n\n- Include the `django.middleware.security.SecurityMiddleware` module in the `MIDDLEWARE` setting in your project's `settings.py` if not already added.\n- Set the `SECURE_SSL_REDIRECT = True` in the `settings.py` file to ensure that all communication is over HTTPS. This will redirect any HTTP requests automatically to HTTPS. This is also a 301 (permanent) redirect, so your browser will remember the redirect for subsequent requests.\n- Configure `SECURE_PROXY_SSL_HEADER` only behind a trusted proxy that strips client-supplied copies of the chosen header and sets its HTTPS-indicating value only for requests originally received over HTTPS. Prevent clients from bypassing that proxy to supply the trusted header directly. If these conditions cannot be guaranteed, leave the setting at `None`; see [Django's proxy-header security warning](https://docs.djangoproject.com/en/5.2/ref/settings/#secure-proxy-ssl-header).\n\n## Admin panel URL\n\nIt is advisable to modify the default URL leading to the admin panel (example.com/admin/), in order to slightly increase the difficulty for automated attacks. Here’s how to do it:\n\nIn the default app folder within your project, locate the `urls.py` file managing the top-level URLs. Within the file, modify the `urlpatterns` variable, a list, so that the URL leading to `admin.site.urls` is different from \"admin/\". This approach adds an extra layer of security by obscuring the common endpoint used for administrative access.\n\n## Django's built-in command `check --deploy`\n\nDjango has built-in command [`check --deploy`](https://docs.djangoproject.com/en/stable/ref/django-admin/#cmdoption-check-deploy) for security checks. Example:\n\n```\n$ ./manage.py check --deploy\nSystem check identified some issues:\n\nWARNINGS:\n?: (security.W004) You have not set a value for the SECURE_HSTS_SECONDS setting. If your entire site is served only over SSL, you may want to consider setting a value and enabling HTTP Strict Transport Security. Be sure to read the documentation first; enabling HSTS carelessly can cause serious, irreversible problems.\n?: (security.W008) Your SECURE_SSL_REDIRECT setting is not set to True. Unless your site should be available over both SSL and non-SSL connections, you may want to either set this setting True or configure a load balancer or reverse-proxy server to redirect all connections to HTTPS.\n?: (security.W009) Your SECRET_KEY has less than 50 characters, less than 5 unique characters, or it's prefixed with 'django-insecure-' indicating that it was generated automatically by Django. Please generate a long and random value, otherwise many of Django's security-critical features will be vulnerable to attack.\n?: (security.W012) SESSION_COOKIE_SECURE is not set to True. Using a secure-only session cookie makes it more difficult for network traffic sniffers to hijack user sessions.\n?: (security.W016) You have 'django.middleware.csrf.CsrfViewMiddleware' in your MIDDLEWARE, but you have not set CSRF_COOKIE_SECURE to True. Using a secure-only CSRF cookie makes it more difficult for network traffic sniffers to steal the CSRF token.\n?: (security.W018) You should not have DEBUG set to True in deployment.\n?: (security.W020) ALLOWED_HOSTS must not be empty in deployment.\n\nSystem check identified 7 issues (0 silenced).\n\n```\n\nYou can harden your Django project by addressing the warnings generated by this command.\n\n## References\n\n- [Django 5.2: Clickjacking Protection](https://docs.djangoproject.com/en/5.2/topics/security/#clickjacking-protection)\n- [Django 5.2: Security Middleware](https://docs.djangoproject.com/en/5.2/ref/middleware/#module-django.middleware.security)\n\n</untrusted>",
