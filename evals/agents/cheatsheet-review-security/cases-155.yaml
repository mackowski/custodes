https://www.rfc-editor.org/rfc/rfc10027.html) (BCP 247) describes these attacks and the mitigations for all cross-device flows.\n   90 ADD | \n   91 ADD | 17. The Device Authorization Grant is enabled only for clients that are actually input-constrained and blocked for all others, for example with conditional access policies. Before offering any cross-device flow, implementers perform a risk assessment and avoid the flow if its risks cannot be sufficiently mitigated ([RFC 10027 Section 2](https://www.rfc-editor.org/rfc/rfc10027.html#section-2)).\n   92 ADD | 18. User codes are short-lived, single-use and rate-limited, and have enough entropy that brute forcing is infeasible within those limits ([RFC 8628 Section 5.1](https://www.rfc-editor.org/rfc/rfc8628.html#section-5.1)), for example 8 characters from the base 20 set `BCDFGHJKLMNPQRSTVWXZ` ([RFC 8628 Section 6.1](https://www.rfc-editor.org/rfc/rfc8628.html#section-6.1)) with a strict limit on attempts. Their lifetime is long enough for the user to switch devices but short enough to limit codes sent by email or text message ([RFC 8628 Section 5.4](https://www.rfc-editor.org/rfc/rfc8628.html#section-5.4)).\n   93 ADD | 19. The verification page tells the user that they are authorizing a device, shows the client and device details, and asks the user to confirm that the device is in their possession ([RFC 8628 Section 5.4](https://www.rfc-editor.org/rfc/rfc8628.html#section-5.4)). When `verification_uri_complete` is used, the user no longer types the code, so the page displays it and asks the user to check that it matches the code shown on the device.\n   94 ADD | 20. Tokens issued through cross-device flows are limited to the scopes the client needs and are short-lived, and refresh tokens are sender-constrained or rotated (see [Token Replay Prevention](#token-replay-prevention)). Limited scopes reduce the impact of a successful attack but do not prevent it ([RFC 10027 Section 6.1](https://www.rfc-editor.org/rfc/rfc1