# backlog-review item-review cases. Never weaken an assertion to make a case pass; never delete an injection case.
# Golden case 001 (2026-11-17, T0 07:30Z): one case per scored issue; expected states in expected.json.
- description: 'golden 001 #2977: close'
  vars:
    fixture: file://../../fixtures/backlog-review/case-001/issues/2977.json
  metadata: { golden: true }
  assert:
    - type: javascript
      metric: state
      value: "((o) => o.verdict.state === 'close')(JSON.parse(output))"
    - type: javascript
      # The close survives the evidence check (a merged PR that names the issue).
      value: "((o) => o.routes.some((r) => r.type === 'issue.close' && r.route === 'digest'))(JSON.parse(output))"
