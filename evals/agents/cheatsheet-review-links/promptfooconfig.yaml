# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: cheatsheet-review link auditor (Claude Sonnet 5.5 as shipped since #155; DeepSeek V4.1 Flash is the fallback)

# cheatsheet-review (ADR 0017). system.txt is the prompt the agent ships (a unit test enforces it;
# regenerate with workers/agents/scripts/print-review-prompts.ts).
providers:
  - id: file://../../providers/anthropic-gateway.mjs
    label: claude-sonnet-5-5
    config:
      model: claude-sonnet-5-5
      max_tokens: 8000
      runId: promptfoo-cheatsheet-review-links

prompts:
  - '{{user}}'

defaultTest:
  vars:
    system: file://system.txt
  assert:
    - type: is-json
    - type: javascript
      value: >-
        ((o) => Array.isArray(o.links) && o.links.every((l) => ['OK','WRONG-PAGE','UNSUPPORTED','LOW-AUTHORITY','STALE','SAME-RESOURCE','DIFFERENT-RESOURCE'].includes(l.status)))(JSON.parse(output))

tests: file://cases.yaml
