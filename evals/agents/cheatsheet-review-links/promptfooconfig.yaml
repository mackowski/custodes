# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: cheatsheet-review link auditor (DeepSeek V4.1 Flash on Workers AI)

# cheatsheet-review (ADR 0017). system.txt is the prompt the agent ships (a unit test enforces it;
# regenerate with workers/agents/scripts/print-review-prompts.ts).
providers:
  - id: file://../../providers/chat-gateway.mjs
    label: deepseek-v4.1-flash-1017
    config:
      transport: workers-ai
      model: '@cf/deepseek-ai/deepseek-v4.1-flash-1017'
      max_tokens: 8000
      runId: promptfoo-cheatsheet-review-links

prompts:
  - '{{user}}'

defaultTest:
  vars:
    system: file://system.txt
  assert:
    - type: is-json
    - type: javascript
      value: >-
        ((o) => Array.isArray(o.links) && o.links.every((l) => ['OK','WRONG-PAGE','UNSUPPORTED','LOW-AUTHORITY','STALE'].includes(l.status)))(JSON.parse(output))

tests: file://cases.yaml
