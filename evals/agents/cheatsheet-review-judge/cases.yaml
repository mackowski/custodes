 Refer to the [Secrets Management Cheat Sheet](Secrets_Management_Cheat_Sheet.md) and [Kubernetes Security Cheat Sheet](Kubernetes_Security_Cheat_Sheet.md) for more information.\n  364     | \n  365 ADD | #### Build-Time Secrets\n  366 ADD | \n  367 ADD | Building images often requires accessing private resources, such as private package registries (e.g., npm or PyPI), private repositories via SSH, or internal API services.\n  368 ADD | \n  369 ADD | **Build-Time Secret Leakage Risks:**\n  370 ADD | \n  371 ADD | Do not pass sensitive credentials using `ARG` or `ENV` instructions in your Dockerfile. Values passed to `ARG` and `ENV` persist in the image layer metadata, configuration history, and container commit history. Anyone with read access to the image or published container registry can extract these cleartext credentials using tools like `docker history` or container layer inspection tools.\n  372 ADD | \n  373 ADD | Similarly, do not use `COPY` or `ADD` to stage credential files (such as `.npmrc` or private keys) into intermediate layers with the intent of deleting them in a subsequent `RUN rm` command. Container filesystem layers are immutable; files added in an earlier layer remain fully retrievable from that intermediate layer even if deleted in a later instruction. [NIST SP 800-190 (Section 3.1.3)](https://csrc.nist.gov/publications/detail/sp/800-190/final) identifies embedded cleartext secrets as a primary image vulnerability and advises against baking static secrets into images.\n  374 ADD | \n  375 ADD | **Recommended Mitigation: BuildKit Secret Mounts:**\n  376 ADD | \n  377 ADD | To use secrets during a build without baking them into any image layer, use [Docker Build secrets](https://docs.docker.com/build/building/secrets/) with BuildKit (`RUN --mount=type=secret`).\n  378 ADD | \n  379 ADD | Secret mounts expose sensitive data only as a temporary, in-memory filesystem mount (by default at `/run/secrets/<id>`) or environment variable for the duration of a specific `RUN` command. When the command completes, the secret is detached and is never written to the intermediate layer or final container filesystem:\n  380 ADD | \n  381 ADD | ```dockerfile\n  382 ADD | # syntax=docker/dockerfile:1\n  383 ADD | FROM node:20-alpine\n  384 ADD | WORKDIR /app\n  385 ADD | COPY package*.json ./\n  386 ADD | \n  387 ADD | # Mount the secret temporarily into memory during package installation\n  388 ADD | RUN --mount=type=secret,id=npmrc,target=/root/.npmrc \\\n  389 ADD |     npm ci --omit=dev\n  390 ADD | \n  391 ADD | COPY . .\n  392 ADD | ```\n  393 ADD | \n  394 ADD | Pass the secret when executing the build command using the `--secret` flag:\n  395 ADD | \n  396 ADD | ```bash\n  397 ADD | # Provide secret from a host file\n  398 ADD | docker build --secret id=npmrc,src=$HOME/.npmrc -t my-app .\n  399 ADD | \n  400 ADD | # Provide secret from a host environment variable\n  401 ADD | docker build --secret id=npmrc,env=NPM_TOKEN -t my-app .\n  402 ADD | ```\n  403 ADD | \n  404 ADD | **Multi-Stage Build Caveats:**\n  405 ADD | \n  406 ADD | While multi-stage builds help produce minimal production runtime images by copying only compiled artifacts to the final stage, they do not automatically protect build-time secrets if credentials are copied into early stages:\n  407 ADD | \n  408 ADD | - **Build cache exposure:** Intermediate builder stages and their layers can persist in local build caches or remote cache backends (such as registry cache manifests), exposing credentials to anyone with cache access.\n  409 ADD | - **Accidental artifact inclusion:** Unrestricted copy instructions (such as `COPY . .`) without a strict `.dockerignore` file can inadvertently pull host secret files (such as `.env` or credential files) into both intermediate and final images.\n  410 ADD | \n  411 ADD | Always combine multi-stage builds with BuildKit secret mounts and a comprehensive `.dockerignore` file rather than relying on stage separation or