name: Diagnose
# Manual health checks for external dependencies, run from GitHub's network. Prints status codes,
# token counts and error classes only; never secrets, prompts or model output.
on:
  workflow_dispatch:
permissions: read-all
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Model smoke test (the exact triage request through AI Gateway)
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          pnpm --filter ./workers/agents exec esbuild scripts/model-smoke.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/model-smoke.mjs" --log-level=warning
          node "$RUNNER_TEMP/model-smoke.mjs"
      - name: Jev (OpenRouter Decisions API) through AI Gateway, and directly when a key is set
        if: always()
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pnpm --filter ./workers/agents exec esbuild scripts/jev-smoke.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/jev-smoke.mjs" --log-level=warning
          node "$RUNNER_TEMP/jev-smoke.mjs" --probe
      - name: GitHub REST rate limit from this runner (unauthenticated)
        if: always()
        run: curl -s https://api.github.com/rate_limit | jq -c '.resources.core'
  # A separate job so that no checkout, dependency or install script can reach the OIDC request
  # token: only curl and jq run while id-token is granted (ADR 0014).
  anthropic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Anthropic workload identity federation used by the Claude review workflow (status and error type only)
        env:
          FEDERATION: '{"federation_rule_id":"fdrl_01Hi7yzTQMu8ts8f1CZSKLbs","organization_id":"4d42e9fa-ed3c-474e-99e1-c308a08fbb25","service_account_id":"svac_01LeBdNzU478KKwVQ441xT1m","workspace_id":"wrkspc_01BAwpcLfNJaeBPkmMbPGZ2p"}'
        run: |
          set -o pipefail
          # The JWT and the access token stay in shell variables and are never printed, so there is
          # nothing to mask: the step prints status codes and error types only.
          out="$RUNNER_TEMP/anthropic.json"
          status() { echo "$1: HTTP $2 $(jq -r '(.error.type // "ok") + " " + ((.error.message // "") | .[0:160])' "$out" 2>/dev/null)"; }
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -er .value) \
            || { echo "GitHub OIDC token: not available"; exit 0; }
          code=$(jq -n --arg jwt "$jwt" --argjson f "$FEDERATION" \
              '$f + {grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $jwt}' \
            | curl -s -o "$out" -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
              -H 'content-type: application/json' --data @-)
          token=$(jq -r '.access_token // empty' "$out")
          # Error type only: federation error messages may echo token claims.
          echo "POST /v1/oauth/token: HTTP $code $(jq -r '.error.type // "ok"' "$out" 2>/dev/null)"
          rm -f "$out"
          if [ -z "$token" ]; then exit 0; fi
          code=$(curl -s -o "$out" -w '%{http_code}' 'https://api.anthropic.com/v1/models?limit=1' \
            -H "Authorization: Bearer $token" -H 'anthropic-version: 2023-06-01')
          status "GET /v1/models" "$code"
          # One output token: also catches billing and model-access errors that /v1/models does not.
          code=$(curl -s -o "$out" -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer $token" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":1,"messages":[{"role":"user","content":"ok"}]}')
          status "POST /v1/messages" "$code"
          rm -f "$out"
