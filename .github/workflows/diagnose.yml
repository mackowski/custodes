name: Diagnose
# Manual health checks for external dependencies, run from GitHub's network. Prints status codes,
# token counts and error classes only; never secrets, prompts or model output.
on:
  workflow_dispatch:
permissions: read-all
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Model smoke test (the exact triage request through AI Gateway)
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          pnpm --filter ./workers/agents exec esbuild scripts/model-smoke.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/model-smoke.mjs" --log-level=warning
          node "$RUNNER_TEMP/model-smoke.mjs"
      - name: GitHub REST rate limit from this runner (unauthenticated)
        if: always()
        run: curl -s https://api.github.com/rate_limit | jq -c '.resources.core'
