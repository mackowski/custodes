name: Evals
# Behavioural and prompt-injection evals for agents, on the real models (Opus 5.5 costs real
# money). Runs on PRs only when something that changes model behaviour changes: prompts, output
# schemas, model choice, the untrusted-data rules, or the evals themselves. Run it by hand
# (workflow_dispatch) for anything else. Needs AI Gateway access: branches in this repository only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evals/**'
      - '.github/workflows/evals.yml'
      - 'workers/agents/src/agents/triage/prompt.ts'
      - 'workers/agents/src/agents/triage/model.ts'
      - 'workers/agents/src/agents/triage/assess.ts'
      - 'workers/agents/src/agents/specialists/implementation.ts'
      - 'workers/agents/src/agents/specialists/proposal.ts'
      - 'workers/agents/src/agents/specialists/select.ts'
      - 'workers/agents/src/agents/specialists/model.ts'
      - 'workers/agents/src/agents/pr-gate/minor.ts'
      - 'workers/agents/src/agents/pr-gate/approval.ts'
      - 'workers/agents/src/agents/pr-gate/rules.ts'
      - 'workers/agents/src/agents/cheatsheet-review/prompts.ts'
      - 'workers/agents/src/agents/cheatsheet-review/lineup.ts'
      - 'workers/agents/src/agents/cheatsheet-review/types.ts'
      - 'workers/agents/src/agents/cheatsheet-review/input.ts'
      - 'packages/llm/src/chat.ts'
      - 'packages/llm/src/structured.ts'
      - 'packages/llm/src/jev.ts'
      - 'packages/llm/src/clef.ts'
      - 'packages/llm/src/models.ts'
      - 'packages/llm/src/untrusted.ts'
permissions: read-all
jobs:
  promptfoo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # promptfoo needs Node >= 22.22; the rest of the pipeline stays on .node-version.
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        working-directory: evals
        env:
          AI_GATEWAY_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AI_GATEWAY_ID: custodes
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          # Jev (pr-gate) is called directly, as the agent does (ADR 0011: AI Gateway returns 404 for
          # OpenRouter's Decisions API).
          JEV_TRANSPORT: direct
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Workers AI Read + Edit only (needed to run models), for the Clef shadow provider (ADR 0015).
          # Unset: the Clef rows error out, report only.
          CF_WORKERS_AI_EVAL_TOKEN: ${{ secrets.CF_WORKERS_AI_EVAL_TOKEN }}
        run: |
          # One config per agent that calls a model: evals/agents/<agent>/promptfooconfig.yaml
          for config in agents/*/promptfooconfig.yaml; do
            name=$(basename "$(dirname "$config")")
            pnpm dlx promptfoo@0.123.1 eval -c "$config" --no-cache -o "output/$name.json" || true
          done
      - name: Summarize results
        if: always()
        run: node evals/summarize.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/output/
          if-no-files-found: ignore
