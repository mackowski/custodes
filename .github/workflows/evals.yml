name: Evals
# Behavioural and prompt-injection evals for agents. Runs on PRs that touch prompts, agents or
# the eval corpus. Needs AI Gateway access, so it runs only for branches in this repository.
on:
  pull_request:
    paths: ['workers/agents/**', 'packages/llm/**', 'evals/**']
permissions: read-all
jobs:
  promptfoo:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        working-directory: evals
        env:
          AI_GATEWAY_ACCOUNT_ID: ${{ vars.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: pnpm dlx promptfoo@0.123.1 eval -c promptfooconfig.yaml --no-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-results
          path: evals/output/
          if-no-files-found: ignore
