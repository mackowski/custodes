name: Evals
# Behavioural and prompt-injection evals for agents. Runs on PRs that touch prompts, agents or
# the eval corpus. Needs AI Gateway access, so it runs only for branches in this repository.
on:
  pull_request:
    paths: ['workers/agents/**', 'packages/llm/**', 'evals/**']
permissions: read-all
jobs:
  promptfoo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        working-directory: evals
        env:
          AI_GATEWAY_ACCOUNT_ID: ${{ vars.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: pnpm dlx promptfoo@0.121.0 eval -c promptfooconfig.yaml --no-cache
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: eval-results
          path: evals/output/
          if-no-files-found: ignore
