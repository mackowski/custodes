name: Evals
# Behavioural and prompt-injection evals for agents. Runs on PRs that touch prompts, agents or
# the eval corpus. Needs AI Gateway access, so it runs only for branches in this repository.
on:
  workflow_dispatch:
  pull_request:
    paths: ['workers/agents/**', 'packages/llm/**', 'evals/**']
permissions: read-all
jobs:
  promptfoo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # promptfoo needs Node >= 22.22; the rest of the pipeline stays on .node-version.
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        working-directory: evals
        env:
          AI_GATEWAY_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AI_GATEWAY_ID: custodes
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          # One config per agent that calls a model: evals/agents/<agent>/promptfooconfig.yaml
          for config in agents/*/promptfooconfig.yaml; do
            pnpm dlx promptfoo@0.123.1 eval -c "$config" --no-cache
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-results
          path: evals/output/
          if-no-files-found: ignore
