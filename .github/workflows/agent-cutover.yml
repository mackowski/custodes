name: Agent cutover
# One-off per agent: moves its Durable Object classes (and their data) from custodes-agents to its
# own Worker (ADR 0018). Run by hand, from main, after the steps in docs/runbooks/agent-cutover.md
# (rehearsal passed, the agent halted, its approvals rejected). The moves are defined in
# scripts/agent-cutover-config.ts. There is no rollback once the source deploy commits the transfer.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to move
        required: true
        type: choice
        options: [pr-gate, cheatsheet-review, triage]
      confirm:
        description: 'Type "move <agent>" (e.g. "move pr-gate"). The agent must be halted first.'
        required: true
        type: string
      phase:
        description: 'full = all three deploys; final-only = only step 3, after a run that committed the transfer'
        required: true
        default: full
        type: choice
        options: [full, final-only]
permissions: read-all
# Never overlaps a normal deploy.
concurrency:
  group: deploy-workers
  cancel-in-progress: false
jobs:
  cutover:
    if: github.ref == 'refs/heads/main' && inputs.confirm == format('move {0}', inputs.agent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
    # The deploy token is given only to the steps that need it, not to install or tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types && pnpm typecheck && pnpm test
      - name: The move
        id: plan
        env:
          AGENT: ${{ inputs.agent }}
        run: node --experimental-strip-types scripts/agent-cutover-config.ts "$AGENT" plan
      - name: Refuse unless every agent in the move is halted
        # The kill switch flags the gateway writes (docs/runbooks/kill-switch.md). Halted means no
        # run, close, review or approval request can start while the objects move.
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AGENT_IDS: ${{ steps.plan.outputs.agent_ids }}
        run: |
          IFS=, read -ra ids <<< "$AGENT_IDS"
          for id in "${ids[@]}"; do
            state="$(pnpm exec wrangler kv key get --remote --namespace-id 841e2b0dd14d48fbac292217839957a4 "halt:$id" 2>/dev/null || true)"
            echo "$state" | grep -q '"halted":true' || { echo "$id is not halted; halt it first"; exit 1; }
          done
      - name: Refuse unless the namespaces are where this phase expects them
        # full: every class must still belong to custodes-agents (never run the transfer twice).
        # final-only: every class must already belong to the target (the transfer committed).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          PHASE: ${{ inputs.phase }}
          CLASSES: ${{ steps.plan.outputs.classes }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          want=custodes-agents
          [ "$PHASE" = final-only ] && want="$TARGET"
          IFS=, read -ra classes <<< "$CLASSES"
          for c in "${classes[@]}"; do
            owner="$(node --experimental-strip-types scripts/do-namespace-owner.ts "$c")"
            [ "$owner" = "$want" ] || { echo "$c belongs to '$owner', expected '$want' for $PHASE"; exit 1; }
          done
      - name: Write the phase configs
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          for phase in target-expecting source-transferred target-final; do
            node --experimental-strip-types scripts/agent-cutover-config.ts "$AGENT" "$phase"
          done
      - name: 1/3 Deploy the agent's Worker expecting the transfer (no class bindings yet), with its secrets
        if: inputs.phase == 'full'
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          DIR: ${{ steps.plan.outputs.dir }}
          SECRETS: ${{ steps.plan.outputs.secrets }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          config="../${DIR#workers/}/.cutover.target-expecting.json"
          pnpm exec wrangler deploy -c "$config"
          IFS=, read -ra names <<< "$SECRETS"
          for name in "${names[@]}"; do
            case "$name" in AI_GATEWAY_TOKEN|OPENROUTER_API_KEY) ;; *) echo "unexpected secret $name"; exit 1 ;; esac
            printf '%s' "${!name}" | pnpm exec wrangler secret put "$name" -c "$config"
          done
      - name: 2/3 Deploy custodes-agents handing the classes over (commits the transfer)
        # Existing Worker secrets are kept across deploys.
        if: inputs.phase == 'full'
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: pnpm exec wrangler deploy -c .cutover.source-transferred.json
      - name: 3/3 Deploy the agent's Worker as committed (bindings, crons, queue)
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          DIR: ${{ steps.plan.outputs.dir }}
        run: pnpm exec wrangler deploy -c "../${DIR#workers/}/.cutover.target-final.json"
      - name: Next steps
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          {
            echo "### Moved to $TARGET"
            echo "The agent stays halted. Its Keyholder makes a key on the first broker call, which the"
            echo "broker refuses until the key is pinned. Follow docs/runbooks/agent-cutover.md: read the"
            echo "keyholder.key.created log line, open and merge the follow-up PR, then resume."
          } >> "$GITHUB_STEP_SUMMARY"
