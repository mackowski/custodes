name: Agent key pin
# Prepares a branch that pins the agent Workers' keys (ADR 0018): reads /admin/agent-keys through
# Cloudflare Access with the read-only service token, updates packages/schema/src/agent-keys.json,
# runs the tests on it and pushes a branch. It does not open the pull request (Actions may not
# create PRs in this repository): the summary links to it, and the operator reviews and merges.
on:
  workflow_dispatch:
permissions: read-all
jobs:
  pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the held keys
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://custodes.work/admin/agent-keys > "$RUNNER_TEMP/agent-keys.json"
      - name: Update agent-keys.json
        id: pin
        run: |
          node --experimental-strip-types scripts/pin-agent-keys.ts "$RUNNER_TEMP/agent-keys.json" | tee "$RUNNER_TEMP/changes.txt"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the result with the schema and the tests
        if: steps.pin.outputs.changed == 'true'
        run: pnpm --filter ./packages/schema --filter ./packages/core --filter ./workers/github-broker test
      - name: Push a branch and link the pull request
        if: steps.pin.outputs.changed == 'true'
        run: |
          branch="keys/pin-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add packages/schema/src/agent-keys.json
          git commit -q -m "chore(keys): pin agent Worker keys (ADR 0018)" -m "$(cat "$RUNNER_TEMP/changes.txt")"
          git push -q origin "$branch"
          {
            echo "### Agent keys to pin"
            echo '```'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
            echo "Compare each kid and fingerprint with /admin/agent-keys/page and the Worker's"
            echo "keyholder.key.created log line before merging."
            echo ""
            echo "[Open the pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"
