name: Agent key pin
# Prepares a branch that pins the agent Workers' keys (ADR 0018): reads /admin/agent-keys through
# Cloudflare Access with the read-only service token, updates packages/schema/src/agent-keys.json,
# runs the tests on it and pushes a branch. It does not open the pull request (Actions may not
# create PRs in this repository): the summary links to it, and the operator reviews and merges.
#
# Two jobs: dependencies and tests run in `prepare`, which can only read; `push` holds the write
# token, installs nothing and only commits the one file `prepare` produced.
on:
  workflow_dispatch:
permissions: read-all
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the held keys
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://custodes.work/admin/agent-keys > "$RUNNER_TEMP/agent-keys.json"
      - name: Update agent-keys.json
        id: pin
        run: |
          # pipefail: a refusal from the script (e.g. a pinned kid whose key differs) must fail the run,
          # not end green as "nothing to pin" behind tee.
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          node --experimental-strip-types scripts/pin-agent-keys.ts "$RUNNER_TEMP/agent-keys.json" | tee "$RUNNER_TEMP/out/changes.txt"
          if git diff --quiet -- packages/schema/src/agent-keys.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          cp packages/schema/src/agent-keys.json "$RUNNER_TEMP/out/agent-keys.json"
      - name: Check the result with the schema and the tests
        if: steps.pin.outputs.changed == 'true'
        run: pnpm --filter ./packages/schema --filter ./packages/core --filter ./workers/github-broker test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pin.outputs.changed == 'true'
        with:
          name: agent-keys
          path: ${{ runner.temp }}/out/
          retention-days: 1

  push:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-keys
          path: ${{ runner.temp }}/in
      - name: Push a branch and link the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/in/agent-keys.json" packages/schema/src/agent-keys.json
          [ -s "$RUNNER_TEMP/in/changes.txt" ] || { echo "agent-keys.json changed with no listed change"; exit 1; }
          # The artifact comes from a job that ran dependencies: accept only the lines the pin script
          # writes (no [skip ci], no Markdown, no links) before they reach the commit or the summary.
          grep -Evq '^(pin custodes-[a-z-]+ (active|next) [a-z0-9][a-z0-9-]{7,79} x=[A-Za-z0-9_-]{43}|retire custodes-[a-z-]+ [a-z0-9][a-z0-9-]{7,79})$' "$RUNNER_TEMP/in/changes.txt" && { echo "unexpected line in changes.txt"; exit 1; }
          # Only that one file may change; anything else means the artifact is not what prepare made.
          [ "$(git status --porcelain | awk '{print $2}')" = "packages/schema/src/agent-keys.json" ] || { echo "unexpected changes"; git status --porcelain; exit 1; }
          branch="keys/pin-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add packages/schema/src/agent-keys.json
          git commit -q -m "chore(keys): pin agent Worker keys (ADR 0018)" -m "$(cat "$RUNNER_TEMP/in/changes.txt")"
          # gh's credential helper reads GH_TOKEN; the token is never written to a file or printed.
          gh auth setup-git
          git push -q origin "$branch"
          {
            echo "### Agent keys to pin"
            echo '```'
            cat "$RUNNER_TEMP/in/changes.txt"
            echo '```'
            echo "Before merging, compare each x in the pull request's diff of agent-keys.json with the"
            echo "keyholder.key.created log line of that Worker (Workers Logs). Neither this summary nor"
            echo "the keys page proves anything: both come from this run and the same gateway."
            echo ""
            echo "[Open the pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"
