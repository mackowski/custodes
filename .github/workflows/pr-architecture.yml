name: PR architecture
# Every pull request carries the "Architecture and data flow" section the /ship skill writes:
# diagrams before and after, the data-flow verdict, the security table and the documentation list
# (.claude/skills/ship/SKILL.md). The operator reviews architecture from it. Dependabot is exempt.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  architecture-section:
    # Exempt only when Dependabot opened the PR and made this push: a human's push to a Dependabot
    # PR is checked (review of #123, L2).
    if: github.event.pull_request.user.login != 'dependabot[bot]' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Capability diff of the policy and its ceiling (ADR 0022)
        # Job summary only: no PR comment, so this workflow keeps a read-only token. The files come
        # from the PR; scripts/policy-diff.ts only parses them and prints sanitised cells.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for name in policy boundary; do
            path="workers/github-broker/policy/$name.json"
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$path"; then continue; fi
            git show "$BASE_SHA:$path" > "$RUNNER_TEMP/$name-base.json" 2>/dev/null || rm -f "$RUNNER_TEMP/$name-base.json"
            git show "$HEAD_SHA:$path" > "$RUNNER_TEMP/$name-head.json" 2>/dev/null || rm -f "$RUNNER_TEMP/$name-head.json"
            node --experimental-strip-types scripts/policy-diff.ts "$RUNNER_TEMP/$name-base.json" "$RUNNER_TEMP/$name-head.json" "$name.json" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Check the PR body
        # The body is untrusted (whoever opens the PR writes it): passed as an environment variable,
        # never interpolated into the script, and only matched by scripts/pr-architecture.ts.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          node --experimental-strip-types scripts/pr-architecture.ts "$RUNNER_TEMP/changed.txt"
