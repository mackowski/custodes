name: Claude review
# Automated first-pass review of this repository's own PRs. Humans still approve.
# Secrets are withheld from fork PRs, so this runs only for branches in this repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: read-all
jobs:
  review:
    # Same-repo, non-draft, human PRs only: dependabot runs cannot read secrets and dependency bumps do not need a model review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull-requests/issues write: the reviews post their findings as PR comments (inline or summary).
    # The job runs only for same-repo, non-dependabot PRs, and the tool allow-lists below permit
    # commenting on this PR and reading the repo, nothing else (no pushes, no arbitrary gh api).
    # Accepted risk: `Read` can reach files on the runner. That is why this job never runs for fork
    # PRs: only collaborators, who already have write access, can trigger it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Code review
        id: code_review
        # Advisory: a failure here must not stop the security review below.
        continue-on-error: true
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/cloudflare/skills.git
          plugins: |
            code-review@claude-code-plugins
            cloudflare@cloudflare
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Exactly the tools the code-review command declares, plus subagents (it launches several)
          # and read-only file tools.
          claude_args: >-
            --allowedTools "Agent,Task,Skill,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh run list:*),Bash(gh run view:*),mcp__github_inline_comment__create_inline_comment"
            --max-turns 60
      # Both action runs write the same execution file; keep the first before the second overwrites it.
      - name: Keep the code review execution log
        if: always()
        env:
          FILE: ${{ steps.code_review.outputs.execution_file }}
        run: if [ -n "$FILE" ] && [ -f "$FILE" ]; then cp "$FILE" "$RUNNER_TEMP/code-review-log.json"; fi
      - name: Agent security review
        id: security_review
        if: always()
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/cloudflare/skills.git
          plugins: cloudflare@cloudflare
          # The skill runs in the read-only security-reviewer subagent, which cannot comment. It returns
          # its report here, and this step posts it: CI output is hidden, so the PR comment is the
          # only place the result shows.
          prompt: |
            Run /agent-security-review ${{ github.event.pull_request.number }} and wait for its report.
            Then post that report as exactly one comment on PR #${{ github.event.pull_request.number }}
            with `gh pr comment ${{ github.event.pull_request.number }} --body-file -`. Start the
            comment with "Custodes agent security review:" and keep its findings, file:line
            references and final verdict. Never include secrets or environment values. If the review
            could not run, post that instead, with the reason.
          claude_args: >-
            --allowedTools "Agent,Task,Skill,Read,Grep,Glob,Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr checks *),Bash(gh pr comment *),Bash(gh run list *),Bash(gh run view *),Bash(git diff *),Bash(git log *),mcp__github_inline_comment__create_inline_comment"
            --max-turns 60
      # The action hides its transcript (it can contain file contents). Print metadata only: which
      # tools ran, which were denied (Bash: first three words of the command), and the outcome.
      - name: Review diagnostics (tool names and outcomes only)
        if: always()
        env:
          CODE_REVIEW_LOG: ${{ runner.temp }}/code-review-log.json
          SECURITY_REVIEW_LOG: ${{ steps.security_review.outputs.execution_file }}
        run: |
          for name in CODE_REVIEW SECURITY_REVIEW; do
            var="${name}_LOG"; file="${!var}"
            echo "== ${name}"
            if [ -z "$file" ] || [ ! -f "$file" ]; then echo "no execution log"; continue; fi
            jq -r '
              def cmd: if .name == "Bash" or .tool_name == "Bash"
                then " " + (((.input // .tool_input).command // "") | split(" ")[0:3] | join(" "))
                else "" end;
              (.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")
                | "tool: \(.name)\(cmd)"),
              (.[] | select(.type == "result")
                | "result: subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)",
                  (.permission_denials[]? | "denied: \(.tool_name)\(cmd)"))
            ' "$file" | sort | uniq -c
          done
