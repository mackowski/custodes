name: Claude review
# Automated first-pass review of this repository's own PRs. Humans still approve.
# Secrets are withheld from fork PRs, so this runs only for branches in this repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: read-all
jobs:
  review:
    # Same-repo, non-draft, human PRs only: dependabot runs cannot read secrets and dependency bumps do not need a model review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Code review
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/cloudflare/skills.git
          plugins: |
            code-review@claude-code-plugins
            cloudflare@cloudflare
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --max-turns 30'
      - name: Agent security review
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/cloudflare/skills.git
          plugins: cloudflare@cloudflare
          prompt: '/agent-security-review ${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff *),Bash(gh pr view *)" --max-turns 30'
