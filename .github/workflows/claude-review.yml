name: Claude review
# Automated first-pass review of this repository's own PRs. Humans still approve.
# Fork PRs get no secrets and no OIDC token (Anthropic access, ADR 0014), so this runs only for
# branches in this repo.
# Each run costs about $1-3, so once per PR: when it is opened as a non-draft, or when a draft is
# marked ready. Work happens in drafts with local reviews first; ready needs the operator's approval
# (CLAUDE.md, Workflow). Run it again by hand with draft → ready.
on:
  pull_request:
    types: [opened, ready_for_review]
permissions: read-all
jobs:
  review:
    # Same-repo, non-draft, human PRs only: dependabot runs cannot read secrets and dependency bumps do not need a model review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull-requests/issues write: the reviews post their findings as PR comments (inline or summary).
    # The job runs only for same-repo, non-dependabot PRs, and the tool allow-lists below permit
    # commenting on this PR and reading the repo, nothing else (no pushes, no arbitrary gh api).
    # Accepted risk: `Read` can reach files on the runner. That is why this job never runs for fork
    # PRs: only collaborators, who already have write access, can trigger it. The runner temp dir
    # (the federation identity and access tokens, ADR 0014) and /proc are denied, so an injected
    # instruction cannot read a token and post it in a comment.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # Anthropic access comes from workload identity federation (ADR 0014): the action exchanges this
    # job's GitHub OIDC token for a short-lived token. These ids identify, they do not authenticate.
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01Hi7yzTQMu8ts8f1CZSKLbs
      ANTHROPIC_ORGANIZATION_ID: 4d42e9fa-ed3c-474e-99e1-c308a08fbb25
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01LeBdNzU478KKwVQ441xT1m
      ANTHROPIC_WORKSPACE_ID: wrkspc_01BAwpcLfNJaeBPkmMbPGZ2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # The security review is skipped only when every changed file is documentation: anything under
      # docs/, or Markdown outside dot-directories (.claude/ skills and agents are prompts) other than
      # CLAUDE.md. evals/ is not documentation: its providers run in CI with the gateway token. Any
      # other file, or a failed listing, runs the review.
      - name: Security review scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "security=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          other=$(grep -v -E '^docs/' <<<"$files" | grep -v -E '^[^.][^/]*(/[^.][^/]*)*\.md$' | grep -c . || true)
          claude_md=$(grep -c -E '(^|/)CLAUDE\.md$' <<<"$files" || true)
          if [ "$other" -gt 0 ] || [ "$claude_md" -gt 0 ]; then security=true; else security=false; fi
          echo "changed files: $(grep -c . <<<"$files"), security review: $security"
          echo "security=$security" >> "$GITHUB_OUTPUT"
      - name: Code review
        id: code_review
        # Advisory: a failure here must not stop the security review below.
        continue-on-error: true
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          # Marketplaces install from their default branch: the action takes only `.git` URLs, so no
          # ref can be pinned. Keep this list to what the review cannot do without.
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Exactly the tools the code-review command declares, plus subagents (it launches several)
          # and read-only file tools.
          claude_args: >-
            --allowedTools "Agent,Task,Skill,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh run list:*),Bash(gh run view:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(//home/runner/work/_temp/**),Read(//proc/**)"
            --max-turns 60
            --max-budget-usd 2
      # Both action runs write the same execution file; keep the first before the second overwrites it.
      - name: Keep the code review execution log
        if: always()
        env:
          FILE: ${{ steps.code_review.outputs.execution_file }}
        run: if [ -n "$FILE" ] && [ -f "$FILE" ]; then cp "$FILE" "$RUNNER_TEMP/code-review-log.json"; fi
      # The deep review runs locally before ready (Opus at xhigh, repeated until clean); CI is the
      # independent second pass at medium effort. The subagent's own `effort` would override a CLI
      # flag, so it is lowered in this runner's checkout only.
      - name: Security review at medium effort
        if: always() && steps.scope.outputs.security != 'false'
        run: |
          sed -i 's/^effort: high$/effort: medium/' .claude/agents/security-reviewer.md
          grep -q '^effort: medium$' .claude/agents/security-reviewer.md
      - name: Agent security review
        id: security_review
        if: always() && steps.scope.outputs.security != 'false'
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          # The skill runs in the read-only security-reviewer subagent, which cannot comment. It returns
          # its report here, and this step posts it: CI output is hidden, so the PR comment is the
          # only place the result shows.
          prompt: |
            Run /agent-security-review ${{ github.event.pull_request.number }} and wait for its report.
            CI lowers `effort` in .claude/agents/security-reviewer.md in this checkout on purpose;
            review only the PR diff (`gh pr diff`), not local changes to the checkout.
            Then post that report as exactly one comment on PR #${{ github.event.pull_request.number }}
            with `gh pr comment ${{ github.event.pull_request.number }} --body-file -`. Start the
            comment with "Custodes agent security review:" and keep its findings, file:line
            references and final verdict. Never include secrets or environment values. If the review
            could not run, post that instead, with the reason.
          claude_args: >-
            --allowedTools "Agent,Task,Skill,Read,Grep,Glob,Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr checks *),Bash(gh pr comment *),Bash(gh run list *),Bash(gh run view *),Bash(git diff *),Bash(git log *),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(//home/runner/work/_temp/**),Read(//proc/**)"
            --max-turns 60
            --max-budget-usd 1.5
      # The action hides its transcript (it can contain file contents). Print metadata only: which
      # tools ran, which were denied (Bash: first three words of the command), the outcome and the
      # cost. The cost also goes to the job summary, so the price of a PR shows without opening logs.
      - name: Review diagnostics (tool names and outcomes only)
        if: always()
        env:
          CODE_REVIEW_LOG: ${{ runner.temp }}/code-review-log.json
          SECURITY_REVIEW_LOG: ${{ steps.security_review.outputs.execution_file }}
        run: |
          for name in CODE_REVIEW SECURITY_REVIEW; do
            var="${name}_LOG"; file="${!var}"
            echo "== ${name}"
            if [ -z "$file" ] || [ ! -f "$file" ]; then echo "no execution log"; continue; fi
            jq -r '
              def cmd: if .name == "Bash" or .tool_name == "Bash"
                then " " + (((.input // .tool_input).command // "") | split(" ")[0:3] | join(" "))
                else "" end;
              (.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")
                | "tool: \(.name)\(cmd)"),
              (.[] | select(.type == "result")
                | "result: subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns) cost_usd=\(.total_cost_usd)",
                  (.permission_denials[]? | "denied: \(.tool_name)\(cmd)"))
            ' "$file" | sort | uniq -c
            cost=$(jq -r '[.[] | select(.type == "result") | .total_cost_usd // 0] | add // 0' "$file")
            echo "${name}: \$${cost}" >> "$GITHUB_STEP_SUMMARY"
          done
