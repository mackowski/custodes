name: Infra (Terraform)
# Two GitHub Environments hold the same Terraform credentials:
#   ci    no reviewers; used to plan on pull requests so the plan is visible before review
#   prod  required reviewer; used to apply on main
on:
  pull_request:
    paths: ['infra/terraform/**']
  push:
    branches: [main]
    paths: ['infra/terraform/**']
  workflow_dispatch:
permissions: read-all
concurrency:
  group: infra
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TERRAFORM }}
      # R2 (Cloudflare) speaks the S3 protocol; Terraform's generic s3 backend reads AWS_* names. No AWS involved.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color -var-file=prod.tfvars.example

  apply:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TERRAFORM }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -var-file=prod.tfvars.example -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
