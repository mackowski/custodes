name: Deploy Workers
# Single environment. Every push to main deploys after the `prod` GitHub Environment's required
# reviewer approves the run. Order matters: agent PATs into Secrets Store, then the broker (agents and
# gateway bind to it). A PAT secret missing from `prod` for a new binding fails the broker deploy.
on:
  push:
    branches: [main]
    paths:
      [
        'workers/**',
        'packages/**',
        'scripts/**',
        'pnpm-lock.yaml',
        '.github/workflows/deploy-workers.yml',
      ]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: deploy-workers
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
      url: https://custodes.work/healthz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types && pnpm typecheck && pnpm test
      - name: Refuse to redeploy a Durable Object class another Worker now owns
        # Before any deploy, so a refusal changes nothing. After an agent's cutover (ADR 0018) and
        # before its follow-up PR, workers/agents/wrangler.jsonc still declares its classes live;
        # deploying it would recreate an empty agent in the shared Worker (or fail). An empty or
        # different owner refuses. docs/runbooks/agent-cutover.md: merge the follow-up first.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: |
          # Every class that has a planned move (scripts/agent-cutover-config.ts).
          classes="$(node --experimental-strip-types scripts/agent-cutover-config.ts classes)"
          node --experimental-strip-types scripts/do-namespace-owner.ts "$classes" --guard workers/agents custodes-agents
          # Moved agents (their classes `transferred` in custodes-agents): their own Worker must
          # still own them (ADR 0018). The list comes from scripts/agent-moves.json.
          moved="$(node --experimental-strip-types scripts/agent-cutover-config.ts moved)"
          while read -r cls dir worker; do
            [ -n "$cls" ] || continue
            node --experimental-strip-types scripts/do-namespace-owner.ts "$cls" --guard "$dir" "$worker" || exit 1
          done <<<"$moved"
      - name: Model smoke test (the real triage request through AI Gateway)
        # Fails the deploy if the model rejects a request parameter, the BYOK key or gateway token is
        # bad, or the answer no longer parses. Costs a fraction of a cent.
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          pnpm --filter ./workers/agents exec esbuild scripts/model-smoke.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/model-smoke.mjs" --log-level=warning
          node "$RUNNER_TEMP/model-smoke.mjs"
      - name: Sync agent PATs into Secrets Store
        # One GitHub Environment secret per agent, named PAT_<AGENT>. Add a line here per agent
        # (GitHub does not allow dynamic secret lookup). Missing ones are skipped with a warning.
        # Runs before the broker deploy so a new agent's Secrets Store binding already resolves.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          SECRETS_STORE_ID: 92c5c38062fc4da98fad1fe4f5a8bda1
          PAT_PR_GATE: ${{ secrets.PAT_PR_GATE }}
          PAT_CHEATSHEET_REVIEW: ${{ secrets.PAT_CHEATSHEET_REVIEW }}
          PAT_READONLY: ${{ secrets.PAT_READONLY }}
          PAT_TRIAGE_APPLY: ${{ secrets.PAT_TRIAGE_APPLY }}
        run: ./scripts/sync-agent-secrets.sh
      - name: Deploy broker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          accountId: 5f62912564df344533c9563904c77662
          workingDirectory: workers/github-broker
          command: deploy
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          accountId: 5f62912564df344533c9563904c77662
          workingDirectory: workers/github-broker
          command: d1 migrations apply AUDIT --remote
      - name: Deploy agents
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          accountId: 5f62912564df344533c9563904c77662
          workingDirectory: workers/agents
          command: deploy
          # Worker secrets are pushed on every deploy from the prod environment; nothing is set by hand.
          # Only what the agents left here (cheatsheet-review) use: no OPENROUTER_API_KEY since
          # pr-gate moved (security review of #114).
          secrets: |
            AI_GATEWAY_TOKEN
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      - name: Drop secrets custodes-agents no longer needs
        # Deploys never delete Worker secrets. pr-gate's OpenRouter key stays out of the shared
        # Worker, which reads untrusted pull request diffs for cheatsheet-review.
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: |
          # Listed first, outside the `if`: a failed list must fail the step (bash -e), not read as
          # "no secret".
          secrets="$(pnpm exec wrangler secret list)"
          if grep -q '"name": *"OPENROUTER_API_KEY"' <<<"$secrets"; then
            pnpm exec wrangler secret delete OPENROUTER_API_KEY
          fi
      - name: Deploy triage
        # triage and its specialists, in their own Worker since the 2026-11-12 cutover (ADR 0018).
        # Not wrangler-action `secrets:`: it ignores `-c` and writes the secrets to custodes-agents
        # (security review of #114). `wrangler secret put -c` targets this Worker; Worker secrets
        # are kept across deploys, so a rotated GitHub secret reaches it on the next deploy.
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          # A missing GitHub secret must fail here, not overwrite the working key with "".
          : "${AI_GATEWAY_TOKEN:?AI_GATEWAY_TOKEN is not set}"
          pnpm exec wrangler deploy -c ../triage/wrangler.jsonc
          printf '%s' "$AI_GATEWAY_TOKEN" | pnpm exec wrangler secret put AI_GATEWAY_TOKEN -c ../triage/wrangler.jsonc
      - name: Deploy pr-gate
        # pr-gate, in its own Worker since its cutover (ADR 0018). Secrets as for triage above.
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          # Jev for pr-gate (ADR 0011: AI Gateway cannot forward the Decisions API yet).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # A missing GitHub secret must fail here, not overwrite the working key with "".
          for name in AI_GATEWAY_TOKEN OPENROUTER_API_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is not set"; exit 1; }
          done
          pnpm exec wrangler deploy -c ../pr-gate/wrangler.jsonc
          for name in AI_GATEWAY_TOKEN OPENROUTER_API_KEY; do
            printf '%s' "${!name}" | pnpm exec wrangler secret put "$name" -c ../pr-gate/wrangler.jsonc
          done
      - name: Deploy triage-apply
        # Its own Worker from the start (ADR 0019): no model, no secrets, no Durable Object moved
        # from custodes-agents. The broker refuses it until its key is pinned (agent-key-pin.yml).
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          accountId: 5f62912564df344533c9563904c77662
          workingDirectory: workers/agents
          command: deploy -c ../triage-apply/wrangler.jsonc
      - name: Deploy gateway
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          accountId: 5f62912564df344533c9563904c77662
          workingDirectory: workers/gateway
          command: deploy
          secrets: |
            GITHUB_WEBHOOK_SECRET
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }} # GitHub forbids secret names starting with GITHUB_
      - name: Smoke test
        # A freshly created custom domain can take a minute to resolve on the runner; retry with backoff.
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://custodes.work/healthz
