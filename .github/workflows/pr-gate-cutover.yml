name: pr-gate cutover
# One-off: moves the PrGateAgent Durable Object (and its stored data) from custodes-agents to its own
# Worker custodes-pr-gate (ADR 0018). Run by hand, from main, after the steps in
# docs/runbooks/pr-gate-cutover.md (transfer test passed, pr-gate halted, approvals rejected).
# There is no rollback once the source deploy commits the transfer.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "move PrGateAgent" to run. pr-gate must be halted first.'
        required: true
        type: string
      phase:
        description: 'full = all three deploys; final-only = only step 3, after a run that committed the transfer'
        required: true
        default: full
        type: choice
        options: [full, final-only]
permissions: read-all
# Never overlaps a normal deploy.
concurrency:
  group: deploy-workers
  cancel-in-progress: false
jobs:
  cutover:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'move PrGateAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
    # The deploy token is given only to the steps that need it, not to install or tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types && pnpm typecheck && pnpm test
      - name: Refuse unless pr-gate is halted
        # The kill switch flag the gateway writes (docs/runbooks/kill-switch.md). Halted means no
        # poll, close or approval request can run while the object moves.
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: |
          state="$(pnpm exec wrangler kv key get --remote --namespace-id 841e2b0dd14d48fbac292217839957a4 'halt:pr-gate' 2>/dev/null || true)"
          echo "$state" | grep -q '"halted":true' || { echo "pr-gate is not halted; halt it first"; exit 1; }
      - name: Refuse unless the namespace is where this phase expects it
        # full: PrGateAgent must still belong to custodes-agents (never run the transfer twice).
        # final-only: it must already belong to custodes-pr-gate (the transfer committed).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          PHASE: ${{ inputs.phase }}
        run: |
          owner="$(node --experimental-strip-types scripts/do-namespace-owner.ts PrGateAgent)"
          want=custodes-agents
          [ "$PHASE" = final-only ] && want=custodes-pr-gate
          [ "$owner" = "$want" ] || { echo "PrGateAgent belongs to '$owner', expected '$want' for $PHASE"; exit 1; }
      - name: Write the phase configs
        run: |
          node --experimental-strip-types scripts/pr-gate-cutover-config.ts target-expecting
          node --experimental-strip-types scripts/pr-gate-cutover-config.ts source-transferred
          node --experimental-strip-types scripts/pr-gate-cutover-config.ts target-final
      - name: 1/3 Deploy custodes-pr-gate expecting the transfer (no PrGateAgent binding yet)
        if: inputs.phase == 'full'
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pnpm exec wrangler deploy -c ../pr-gate/.cutover.target-expecting.json
          printf '%s' "$AI_GATEWAY_TOKEN" | pnpm exec wrangler secret put AI_GATEWAY_TOKEN -c ../pr-gate/.cutover.target-expecting.json
          printf '%s' "$OPENROUTER_API_KEY" | pnpm exec wrangler secret put OPENROUTER_API_KEY -c ../pr-gate/.cutover.target-expecting.json
      - name: 2/3 Deploy custodes-agents handing PrGateAgent over (commits the transfer)
        # Existing Worker secrets are kept across deploys.
        if: inputs.phase == 'full'
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: pnpm exec wrangler deploy -c .cutover.source-transferred.json
      - name: 3/3 Deploy custodes-pr-gate with its binding, crons and queue
        working-directory: workers/agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: 5f62912564df344533c9563904c77662
        run: pnpm exec wrangler deploy -c ../pr-gate/.cutover.target-final.json
      - name: Next steps
        run: |
          {
            echo "### PrGateAgent moved to custodes-pr-gate"
            echo "pr-gate stays halted. Its Keyholder makes a key on the first broker call, which the"
            echo "broker refuses until the key is pinned. Follow docs/runbooks/pr-gate-cutover.md:"
            echo "open /admin/keys, merge the follow-up PR (key pin, transferred tombstone in"
            echo "custodes-agents, pr-gate in deploy-workers.yml, gateway queue, isolated: true), resume."
          } >> "$GITHUB_STEP_SUMMARY"
