packages:
  - packages/*
  - workers/*
  - apps/*

# Supply-chain hardening
minimumReleaseAge: 4320 # 3 days, in minutes: skip freshly published versions
minimumReleaseAgeExclude:
  - '@custodes/*'
strictDepBuilds: true
onlyBuiltDependencies:
  - esbuild
  - workerd
  - '@cloudflare/workerd-darwin-arm64'
  - '@cloudflare/workerd-darwin-64'
  - '@cloudflare/workerd-linux-64'
  - '@cloudflare/workerd-linux-arm64'
ignoredBuiltDependencies:
  - core-js-pure

# Security overrides for transitive dev-only dependencies (remove when upstream catches up).
overrides:
  sharp: 0.35.5 # GHSA-wq5f-xc86-pv6w (librsvg), via @cloudflare/vitest-pool-workers > miniflare
  shell-quote: 1.11.0 # GHSA-pqg4-j6r4-53mv, via @changesets/cli > launch-editor; dev only
  esbuild: 0.28.2 # GHSA-g7r4-m6w7-qqqr (fixed in 0.28.1), via tsup and vite; build/dev only
  undici: 7.30.1 # GHSA-3wwx-pv8p-q78v, GHSA-2m5v-pch6-74hx, GHSA-4qv8-2p9j-2685, GHSA-4w7w-5xrc-9h26, GHSA-55wc-3pg8-jfw6, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472, GHSA-qrxm-fqhp-jwvm, GHSA-xjj6-f33q-929c (fixed in 7.30.1), via miniflare (wrangler, vitest-pool-workers); dev/test only
  vite: 8.3.3 # Dependabot vite alerts (fixed in 8.3.3), via vitest; dev/test only
  launch-editor: 2.14.2 # Dependabot launch-editor alerts (fixed in 2.14.2), via @changesets/cli and vite; dev only
  minimatch: 11.0.1 # GHSA-g3hv-75wg-m249 (fixed in 11.0.1, no 10.x fix); adds @isaacs/nonrecursive-glob-match; via eslint, dev only
  '@cloudflare/vitest-pool-workers>zod': 4.6.7 # GHSA-mrhx-c7xc-m3w5 (fixed in 4.6.6); scoped so runtime zod stays under normal Dependabot bumps; @cloudflare/vitest-pool-workers pins 4.4.3, dev/test only
